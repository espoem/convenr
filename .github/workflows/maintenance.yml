name: Maintenance

# The production instance on Vercel runs no long-lived process, so this schedule asks it to run
# the maintenance pass every hour (ADR 0010). The runner holds only the route's secret: no
# database address and no mail settings, and it sees no data.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  maintain:
    name: Run the maintenance pass on the instance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Call the maintenance route
        env:
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        # The header comes from standard input, so the secret is not in the process list.
        run: |
          printf 'Authorization: Bearer %s\n' "$MAINTENANCE_SECRET" |
            curl --fail-with-body --silent --show-error --max-time 120 --retry 2 \
              --request POST --header @- "$PRODUCTION_URL/api/maintenance"
