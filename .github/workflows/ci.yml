name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner image has Podman installed but no Podman service running; its Docker
      # daemon is the one that runs the test database.
      CONTAINER_ENGINE: docker
      # The OpenAPI document must not break clients of the one on main: a pull request is
      # compared with its base branch, a push to main with main before the push.
      OPENAPI_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The breaking-change check reads the base revision's document.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Install dependencies
        run: nub ci
      - name: Format, lint, theme, type check, unit tests, OpenAPI and SDK checks, build
        run: mise run check
      - name: SDK acceptance tests
        run: mise run sdk:acceptance
      - name: Install the test browser
        working-directory: apps/web
        run: nubx playwright install --with-deps chromium
      - name: End-to-end tests
        run: mise run e2e
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  bun:
    name: Unit tests and build under Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: nub ci
      - name: Unit tests
        working-directory: apps/web
        run: bun --bun x vitest run --project unit
      - name: Build
        working-directory: apps/web
        run: bun --bun x next build

  compose:
    name: Container image and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start
        run: docker compose up --build --detach --wait
      - name: The application reaches the database
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:3000/api/health | tee health.json
          grep --quiet '"database":"ok"' health.json
      - name: The start page is served in both languages
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/cs
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/en
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

  # A push to main that passes every job reaches production (ADR 0005). The database is migrated
  # first, by a job that holds no Vercel token, so the code being replaced must work with the new schema.
  migrate:
    name: Migrate the production database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, bun, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node npm:@nubjs/nub
      - name: Install dependencies
        run: nub ci
      - name: Apply pending migrations
        working-directory: apps/web
        run: node scripts/migrate.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy:
    name: Deploy to production
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node npm:@nubjs/nub npm:vercel
      - name: Install dependencies
        run: nub ci
      - name: Read the project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: The production instance reaches its database
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            "$PRODUCTION_URL/api/health" | tee health.json
          grep --quiet '"database":"ok"' health.json
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
