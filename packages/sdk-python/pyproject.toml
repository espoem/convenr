[project]
name = "convenr"
version = "0.0.0"
description = "Client for the convenr API, generated from its OpenAPI document"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
# The libraries the generated code imports, in the ranges the generator supports.
dependencies = ["attrs>=22.2.0", "httpx2>=2.13.1,<3"]

[dependency-groups]
dev = ["openapi-python-client==0.30.0", "pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
