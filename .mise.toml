min_version = "2026.11.10"

[tools]
node = "26.13.1"
"npm:@nubjs/nub" = "0.11.1"
# Compose implementation used by `docker compose` and by `podman compose`.
docker-compose = "5.7.0"
# Git hooks; the configuration is hk.pkl.
hk = "2.13.0"
# Lints the OpenAPI document; the configuration is redocly.yaml.
"npm:@redocly/cli" = "2.79.0"
# Finds breaking changes between two OpenAPI documents.
"github:oasdiff/oasdiff" = "1.39.0"
# The Python SDK: uv installs its locked generator, test runner and dependencies.
python = "3.14.10"
uv = "0.13.9"
# Builds and deploys the Vercel instance from CI. Vercel publishes it from a private repository,
# so it has no npm provenance; mise 2026.11.10 is the first whose trust check knows that.
"npm:vercel" = "65.17.0"
# Lint the GitHub workflows; jactionlint runs shellcheck on each `run` script.
jactionlint = "2.6.0"
shellcheck = "0.11.0"
zizmor = "1.32.0"

[env]
_.path = ["node_modules/.bin"]
# Redocly CLI sends usage data and checks for updates unless told not to.
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"

[tasks.install]
description = "Install dependencies from the lockfile and the Git hooks"
run = ["nub install", "hk install --mise"]

[tasks.typegen]
description = "Generate the Next.js route types that the type checks read"
dir = "apps/web"
run = "nubx next typegen"

[tasks.lint]
description = "Lint and type-check with oxlint; warnings fail"
depends = ["typegen"]
run = "nub run lint"

[tasks.format]
description = "Format with oxfmt"
run = "nub run format"

[tasks."format:check"]
description = "Fail when a file is not formatted"
run = "nub run format:check"

[tasks.typecheck]
description = "Type-check every workspace package"
run = "nub run -r typecheck"

[tasks.build]
description = "Production build of the web application"
run = "nub run --filter @convenr/web build"

[tasks.dev]
description = "Run the web application in development mode"
run = "nub run --filter @convenr/web dev"

[tasks.purge]
description = "Delete expired events now; the server also does it every hour"
run = "node --env-file-if-exists=.env apps/web/scripts/purge.mts"

[tasks.usage]
description = "Print the daily usage counts; optional first and last day, e.g. 2027-03-01 2027-03-31"
run = "node --env-file-if-exists=.env apps/web/scripts/usage.mts"

[tasks.theme]
description = "Generate tokens.css from DESIGN.md"
run = "nub apps/web/scripts/generate-theme.ts"

[tasks."theme:check"]
description = "Fail when tokens.css does not match DESIGN.md"
run = "nub apps/web/scripts/generate-theme.ts --check"

[tasks.openapi]
description = "Write apps/web/openapi.json from the API's schemas and operations"
dir = "apps/web"
run = "nubx vitest run --project unit src/server/api/openapi.test.ts --update"

[tasks."openapi:lint"]
description = "Lint the committed OpenAPI document with Redocly CLI"
run = "redocly lint apps/web/openapi.json"

[tasks."openapi:breaking"]
description = "Fail when the OpenAPI document breaks clients of main's; OPENAPI_BASE sets another base"
run = "scripts/openapi-breaking.sh"

[tasks."workflows:lint"]
description = "Lint the GitHub workflows with jactionlint and zizmor"
# Offline, so a GitHub token in the shell does not add checks that CI does not run.
run = ["jactionlint", "zizmor --offline .github/workflows"]

[tasks.sdk]
description = "Generate both SDKs from apps/web/openapi.json"
run = [
  "cd packages/sdk-codegen && nubx openapi-ts",
  "cd packages/sdk-python && uv run --locked openapi-python-client generate --path ../../apps/web/openapi.json --config openapi-python-client.yaml --meta none --output-path src/convenr --overwrite",
]

[tasks."sdk:check"]
description = "Fail when a committed SDK differs from one generated afresh"
depends = ["sdk"]
run = "scripts/sdk-check.sh"

[tasks."sdk:acceptance"]
description = "Run both SDKs' acceptance tests against the production build (needs `mise run build`); starts PostgreSQL"
depends = ["db:up"]
run = "node apps/web/scripts/sdk-acceptance.mts"

[tasks.up]
description = "Build and start the application and PostgreSQL in containers"
run = "scripts/compose.sh up --build --detach --wait"

[tasks.down]
description = "Stop the containers; the database volume is kept"
run = "scripts/compose.sh down"

[tasks."db:up"]
description = "Start only PostgreSQL, for development with `mise run dev`"
run = "scripts/compose.sh up --detach --wait db"

[tasks."db:generate"]
description = "Generate a SQL migration from the Drizzle schema"
dir = "apps/web"
run = "nubx drizzle-kit generate"

[tasks."db:migrate"]
description = "Apply pending SQL migrations with the server's migrator and lock"
dir = "apps/web"
run = "node --env-file-if-exists=../../.env scripts/migrate.mts"

[tasks.test]
description = "Run unit tests and database tests; starts PostgreSQL"
depends = ["db:up"]
run = ["nub run -r test", "cd packages/sdk-python && uv run --locked pytest"]

[tasks.e2e]
description = "Run end-to-end tests against the production build (needs `mise run build`); starts PostgreSQL"
depends = ["db:up"]
run = "nub run --filter @convenr/web e2e"

[tasks.check]
description = "Everything CI checks except end-to-end tests"
# Sequential: the build rewrites the generated route types that the type check reads.
run = [
  "mise run format:check",
  "mise run lint",
  "mise run workflows:lint",
  "mise run theme:check",
  "mise run typecheck",
  "mise run test",
  "mise run openapi:lint",
  "mise run openapi:breaking",
  "mise run sdk:check",
  "mise run build",
]
